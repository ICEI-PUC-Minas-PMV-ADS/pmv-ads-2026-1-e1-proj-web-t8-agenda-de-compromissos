<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Calendários</title>
    <script src="../js/shared.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/dashboard.js"></script>
    <link rel="stylesheet" href="../style/dashboard.css">
</head>
<body>
    <div class="background-glow"></div>
    <div id="main-dashboard" class="screen conteiner">
        <header>
            <h1>📅 Minha Agenda</h1>
            <div class="user-info">
                Olá, <span id="current-user-name"></span>!
                <button id="logout-btn">Sair</button>
            </div>
        </header>

        <div class="dashboard-layout">
            <aside class="sidebar">
                <a href="dashboard.html" class="nav-btn active">🗓️ Calendários</a>
                <a href="task.html" class="nav-btn">📋 Todas as Tarefas</a>
                <a href="task-create.html" class="nav-btn">➕ Nova Tarefa</a>
                <a href="profile.html" class="nav-btn">👤 Editar Perfil</a>
                <a href="trash.html" class="nav-btn">🗑️ Lixeira (<span id="trash-count">0</span>)</a>
            </aside>

            <main class="content-area">
                <section id="calendar-view">
                    <div class="calendar-controls">
                        <div class="view-switcher">
                            <button class="view-btn active" data-view="month">Mês</button>
                            <button class="view-btn" data-view="week">Semana</button>
                            <button class="view-btn" data-view="day">Dia</button>
                        </div>
                        <div class="calendar-navigation">
                            <button id="prev-period">◀</button>
                            <h3 id="calendar-title">Mês Ano</h3>
                            <button id="next-period">▶</button>
                        </div>
                    </div>
                    
                    <div id="month-calendar" class="calendar-grid month-grid"></div>
                    <div id="week-calendar" class="calendar-grid hidden"></div>
                    <div id="day-calendar" class="calendar-grid hidden"></div>
                </section>
            </main>
        </div>
    </div>


</body>
</html>
