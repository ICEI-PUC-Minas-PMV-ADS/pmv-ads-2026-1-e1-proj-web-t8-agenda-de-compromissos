<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Master - Lista de Tarefas</title>
    <link rel="stylesheet" href="../style/home.css">
    <script src="../js/home.js" defer></script>
    <script src="../js/menu.js" defer></script>
    <link rel="stylesheet" href="../style/menu.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- CONTAINER PRINCIPAL: LISTA POR PRIORIDADE -->
    <div class="container task-container">
        <p class="title">Lista de Tarefas</p>
        <hr>

            <div class="search-area">
        <span class="search-icon">🔎</span>
        <input 
            type="text" 
            id="searchTaskInput" 
            placeholder="Pesquisar por título..."
        >
    </div>

    <div class="date-filter-area">
        <label for="dateTaskInput">DATA</label>
        <input 
            type="date" 
            id="dateTaskInput"
        >
    </div>

        <div class="tasks-scroll">
            <section class="urgency-section">
                <h2 class="h2 alta-title">🚨 Alta prioridade</h2>
                <div class="task-list" id="altaUrge"></div>
            </section>

            <section class="urgency-section">
                <h2 class="h2 media-title">🔔 Média prioridade</h2>
                <div class="task-list" id="mediaUrge"></div>
            </section>

            <section class="urgency-section">
                <h2 class="h2 baixa-title">✅ Baixa prioridade</h2>
                <div class="task-list" id="baixaUrge"></div>
            </section>
        </div>

        <a href="./task-create.html" class="add-task-btn">＋</a>
    </div>

    <!-- CONTAINER SECUNDÁRIO: RESUMO -->
    <div class="container info-container hidden">
        <p class="title">Resumo</p>
        <hr>

        <section class="info-section">
            <div id="monthDisplay"></div>
        </section>

        <div class="info-content">
            <section class="info-section">
                <h2 class="h2 hoje-title">🗓️ Hoje</h2>
                <div class="mini-list" id="hojeList"></div>
            </section>

            <section class="info-section">
                <h2 class="h2 amanha-title">📅 Amanhã</h2>
                <div class="mini-list" id="amanhaList"></div>
            </section>
        </div>
    </div>

    <!-- BOTÃO PARA TROCAR ENTRE LISTA E RESUMO -->
    <button class="switch-container-btn" id="switchContainerBtn">
        Ver resumo
    </button>

</body>
</html>
