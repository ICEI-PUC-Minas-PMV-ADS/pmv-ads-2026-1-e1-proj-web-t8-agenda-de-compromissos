<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Tarefa</title>
    <link rel="icon" href="../img/logo.png" type="image/x-icon">
    <script src="../js/shared.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/task-create.js"></script>
    <link rel="stylesheet" href="../style/task.css">
</head>
<body>
    <div class="background-glow"></div>
    <div id="main-dashboard" class="screen conteiner">
        <header>
            <h1>📅 Minha Agenda</h1>
            <div class="user-info">
                Olá, <span id="current-user-name"></span>!
                <button id="logout-btn">Sair</button>
            </div>
        </header>

        <div class="dashboard-layout">
            <aside class="sidebar">
                <a href="home.html" class="nav-btn active">🏠 Início</a>
                <a href="dashboard.html" class="nav-btn">🗓️ Calendários</a>
                <a href="task.html" class="nav-btn">📋 Todas as Tarefas</a>
                <a href="task-create.html" class="nav-btn">➕ Nova Tarefa</a>
                <a href="profile.html" class="nav-btn">👤 Editar Perfil</a>
                <a href="trash.html" class="nav-btn">🗑️ Lixeira (<span id="trash-count">0</span>)</a>
            </aside>

            <main class="content-area">
                <div class="task-form-header">
                    <div class="header-icon-title">
                        <span class="sparkle-icon">✨</span>
                        <div>
                            <h2>Nova Atividade</h2>
                            <p class="subtitle">Planeje e insira um novo compromisso na sua agenda</p>
                        </div>
                    </div>
                </div>

                <form id="task-form">
                    <div class="form-container-grid">
                        <div class="category-selector">
                            <label style="color: #c7d2fe; font-size: 12px; font-weight: bold;">Categoria</label>
                            <input type="hidden" id="task-category" value="Outro">
                            <button type="button" class="cat-btn" data-cat="Viagem">✈️ Viagem</button>
                            <button type="button" class="cat-btn" data-cat="Café">☕ Café</button>
                            <button type="button" class="cat-btn" data-cat="Almoço">🍛 Almoço</button>
                            <button type="button" class="cat-btn" data-cat="Job">💼 Job</button>
                            <button type="button" class="cat-btn" data-cat="Lazer">🚲 Lazer</button>
                            <button type="button" class="cat-btn active" data-cat="Outro">➕ Outro</button>
                        </div>

                        <div class="form-fields-grid">
                            <div class="input-box">
                                <label for="task-title">O que será feito?</label>
                                <input type="text" id="task-title" required placeholder="Ex: Reunião de Alinhamento">
                            </div>
                            <div class="input-box">
                                <label for="task-location">Onde?</label>
                                <input type="text" id="task-location" placeholder="Ex: Google Meet, Escritório...">
                            </div>
                            <div class="input-box">
                                <label for="task-date">Data Limite</label>
                                <input type="date" id="task-date" required>
                            </div>
                            <div class="input-box">
                                <label>Horário</label>
                                <div class="time-input-split">
                                    <input type="number" id="task-hour" min="0" max="23" required placeholder="00">
                                    <span>:</span>
                                    <input type="number" id="task-minute" min="0" max="59" required placeholder="00">
                                </div>
                            </div>
                            <div class="input-box full-width">
                                <label>Integrantes</label>
                                <div class="tags-input-container">
                                    <input type="text" id="member-input" placeholder="Adicionar nome de parceiro...">
                                    <button type="button" id="add-member-btn">+</button>
                                </div>
                                <div id="members-tags-list" class="tags-list"></div>
                            </div>
                            <div class="input-box full-width">
                                <label for="task-desc">Notas Adicionais</label>
                                <textarea id="task-desc" rows="4" placeholder="Adicione observações importantes aqui..."></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="form-footer-actions">
                        <button type="submit" class="btn" style="width: auto; padding: 15px 40px; background: linear-gradient(90deg, #00ffff, #0077ff);">Criar Atividade</button>
                    </div>
                </form>
            </main>
        </div>
    </div>


</body>
</html>
